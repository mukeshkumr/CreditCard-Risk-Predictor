    "joblib==1.6.0",
    "uvicorn>=0.53.0",
    "xgboost==3.4.1",
    "numpy==2.1.3",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "ruff>=0.16.8",
    "pip>=26.2.1",
]
